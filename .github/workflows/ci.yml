name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter strong-towns-tracker-server run lint

      - name: Typecheck
        run: pnpm --filter strong-towns-tracker-server run typecheck

      - name: Build
        run: pnpm --filter strong-towns-tracker-server run build
